version: 2

models:
  - name: int_sales_order_items
    description: >
      Itens de pedidos enriquecidos com informações do cabeçalho e valores
      bruto, de desconto e líquido. Granularidade de uma linha por item.

    columns:
      - name: sales_order_detail_id
        description: Identificador único do item do pedido.
        data_tests:
          - not_null
          - unique

      - name: sales_order_id
        description: Identificador do pedido.
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_salesorderheader')
                field: sales_order_id

      - name: product_id
        description: Identificador do produto vendido.
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_product')
                field: product_id

      - name: customer_id
        description: Identificador do cliente.
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_customer')
                field: customer_id

      - name: order_date
        description: Data de realização do pedido.
        data_tests:
          - not_null

      - name: order_quantity
        description: Quantidade vendida.
        data_tests:
          - not_null

      - name: gross_amount
        description: Valor bruto do item antes do desconto.
        data_tests:
          - not_null

      - name: discount_amount
        description: Valor monetário do desconto aplicado.
        data_tests:
          - not_null

      - name: net_amount
        description: Valor líquido do item após o desconto.
        data_tests:
          - not_null