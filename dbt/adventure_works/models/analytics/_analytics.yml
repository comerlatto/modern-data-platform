version: 2

models:
  - name: dim_product
    description: >
      Dimensão de produtos utilizada nas análises de vendas.
      Grão: uma linha por produto, identificado por product_id.

    columns:
      - name: product_id
        description: >
          Identificador único do produto no sistema de origem.
          Chave primária da dimensão.
        data_type: integer
        constraints:
          - type: not_null
          - type: primary_key
        data_tests:
          - not_null
          - unique

      - name: product_name
        description: Nome descritivo do produto.
        data_type: varchar(50)
        constraints:
          - type: not_null

      - name: product_number
        description: Código comercial utilizado para identificar o produto.
        data_type: varchar(25)
        constraints:
          - type: not_null

      - name: is_manufactured
        description: Indica se o produto é fabricado internamente.
        data_type: boolean

      - name: is_finished_good
        description: Indica se o produto está pronto para comercialização.
        data_type: boolean

      - name: color
        description: Cor cadastrada para o produto.
        data_type: varchar(15)

      - name: size
        description: Tamanho cadastrado para o produto.
        data_type: varchar(5)

      - name: size_unit_measure_code
        description: Unidade de medida utilizada para o tamanho.
        data_type: varchar(3)

      - name: weight
        description: Peso cadastrado do produto.
        data_type: numeric(8, 2)

      - name: weight_unit_measure_code
        description: Unidade de medida utilizada para o peso.
        data_type: varchar(3)

      - name: product_line
        description: Código da linha comercial do produto.
        data_type: varchar(2)

      - name: product_class
        description: Código da classificação do produto.
        data_type: varchar(2)

      - name: product_style
        description: Código do estilo do produto.
        data_type: varchar(2)

      - name: safety_stock_level
        description: Quantidade mínima recomendada para estoque de segurança.
        data_type: smallint

      - name: reorder_point
        description: Nível de estoque que indica necessidade de reposição.
        data_type: smallint

      - name: days_to_manufacture
        description: Quantidade estimada de dias para fabricar o produto.
        data_type: integer

      - name: standard_cost
        description: >
          Custo padrão atual do produto. Não representa necessariamente
          o custo histórico no momento da venda.
        data_type: numeric(19, 4)

      - name: list_price
        description: >
          Preço de lista atual do produto. Não representa necessariamente
          o preço praticado em uma venda.
        data_type: numeric(19, 4)

      - name: product_subcategory_id
        description: Identificador da subcategoria do produto.
        data_type: integer

      - name: product_model_id
        description: Identificador do modelo do produto.
        data_type: integer

      - name: sell_start_date
        description: Data e hora de início da comercialização.
        data_type: timestamp

      - name: sell_end_date
        description: Data e hora de encerramento da comercialização.
        data_type: timestamp

      - name: discontinued_date
        description: Data e hora em que o produto foi descontinuado.
        data_type: timestamp



  - name: dim_customer
    description: >
      Dimensão de clientes com uma linha por customer_id. Enriquece o
      cadastro com os nomes da pessoa e da loja e classifica cada cliente
      como Person, Store ou Store with person.

    config:
      materialized: table
      contract:
        enforced: true

    columns:
      - name: customer_id
        description: Identificador único do cliente.
        data_type: integer
        constraints:
          - type: not_null
          - type: primary_key
        data_tests:
          - not_null
          - unique

      - name: person_id
        description: >
          Identificador da pessoa associada ao cliente, quando aplicável.
          A integridade com stg_person é validada pelo teste relationships.
        data_type: integer
        data_tests:
          - relationships:
              arguments:
                to: ref('stg_person')
                field: business_entity_id

      - name: store_id
        description: >
          Identificador da loja associada ao cliente, quando aplicável.
          A integridade com stg_store é validada pelo teste relationships.
        data_type: integer
        data_tests:
          - relationships:
              arguments:
                to: ref('stg_store')
                field: business_entity_id

      - name: territory_id
        description: Identificador do território comercial associado ao cliente.
        data_type: integer
        data_tests:
          - relationships:
              arguments:
                to: ref('stg_salesterritory')
                field: territory_id

      - name: person_name
        description: Nome completo da pessoa associada ao cliente.
        data_type: text

      - name: store_name
        description: Nome da loja associada ao cliente.
        data_type: character varying(50)

      - name: customer_type
        description: >
          Classificação do cliente conforme sua associação com pessoa e loja.
        data_type: text
        constraints:
          - type: not_null
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values:
                  - Person
                  - Store
                  - Store with person

      - name: row_guid
        description: Identificador global do cadastro no sistema de origem.
        data_type: uuid
        constraints:
          - type: not_null
        data_tests:
          - not_null

      - name: modified_at
        description: Data e hora da última modificação no sistema de origem.
        data_type: timestamp without time zone
        constraints:
          - type: not_null
        data_tests:
          - not_null

      - name: _loaded_at
        description: Data e hora em que o registro foi carregado na camada raw.
        data_type: timestamp with time zone
        constraints:
          - type: not_null
        data_tests:
          - not_null

      - name: _source_table
        description: Tabela de origem do cadastro do cliente.
        data_type: text
        constraints:
          - type: not_null
        data_tests:
          - not_null