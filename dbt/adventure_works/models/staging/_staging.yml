version: 2

models:
  - name: stg_salesorderheader
    description: Pedidos de venda padronizados a partir da camada raw.

    columns:
      - name: sales_order_id
        description: Identificador único do pedido.
        data_tests:
          - not_null
          - unique

      - name: customer_id
        description: Identificador do cliente associado ao pedido.
        data_tests:
          - not_null

      - name: order_date
        description: Data em que o pedido foi realizado.
        data_tests:
          - not_null



  - name: stg_salesorderdetail
    description: Itens dos pedidos de venda padronizados a partir da camada raw.

    columns:
      - name: sales_order_detail_id
        description: Identificador único do item do pedido.
        data_tests:
          - not_null
          - unique

      - name: sales_order_id
        description: Identificador do pedido ao qual o item pertence.
        data_tests:
          - not_null

      - name: product_id
        description: Identificador do produto vendido.
        data_tests:
          - not_null

      - name: order_quantity
        description: Quantidade vendida do produto.
        data_tests:
          - not_null

      - name: unit_price
        description: Preço unitário do produto no pedido.
        data_tests:
          - not_null


  - name: stg_customer
    description: Clientes padronizados a partir da camada raw.

    columns:
      - name: customer_id
        description: Identificador único do cliente.
        data_tests:
          - not_null
          - unique

      - name: territory_id
        description: Identificador do território comercial associado ao cliente.

  - name: stg_person
    description: Pessoas padronizadas a partir da camada raw.

    columns:
      - name: business_entity_id
        description: Identificador único da pessoa.
        data_tests:
          - not_null
          - unique

      - name: person_type
        description: Tipo de pessoa no AdventureWorks.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['EM', 'GC', 'IN', 'SC', 'SP', 'VC']

      - name: first_name
        description: Primeiro nome da pessoa.
        data_tests:
          - not_null

      - name: last_name
        description: Sobrenome da pessoa.
        data_tests:
          - not_null




  - name: stg_salesterritory
    description: Territórios comerciais padronizados a partir da camada raw.

    columns:
      - name: territory_id
        description: Identificador único do território comercial.
        data_tests:
          - not_null
          - unique

      - name: territory_name
        description: Nome do território comercial.
        data_tests:
          - not_null

      - name: country_region_code
        description: Código do país ou região do território.
        data_tests:
          - not_null

      - name: territory_group
        description: Grupo geográfico ao qual pertence o território.
        data_tests:
          - not_null



  - name: stg_product
    description: Produtos padronizados a partir da camada raw.

    columns:
      - name: product_id
        description: Identificador único do produto.
        data_tests:
          - not_null
          - unique

      - name: product_name
        description: Nome do produto.
        data_tests:
          - not_null

      - name: product_number
        description: Código único de identificação do produto.
        data_tests:
          - not_null
          - unique

      - name: is_manufactured
        description: Indica se o produto é fabricado internamente.
        data_tests:
          - not_null

      - name: is_finished_good
        description: Indica se o produto está disponível para venda.
        data_tests:
          - not_null

      - name: standard_cost
        description: Custo padrão do produto.
        data_tests:
          - not_null

      - name: list_price
        description: Preço de tabela do produto.
        data_tests:
          - not_null

      - name: sell_start_date
        description: Data de início da comercialização.
        data_tests:
          - not_null



          

  - name: stg_store
    description: >
      Padroniza o cadastro de lojas do AdventureWorks. Possui uma linha por
      loja e serve para identificar os clientes empresariais.

    columns:
      - name: business_entity_id
        description: Identificador único da loja e chave de relacionamento com stg_customer.store_id.
        data_tests:
          - not_null
          - unique

      - name: store_name
        description: Nome da loja ou empresa.
        data_tests:
          - not_null

      - name: sales_person_id
        description: Identificador do vendedor responsável pela loja.

      - name: demographics
        description: Informações demográficas da loja armazenadas em XML.

      - name: row_guid
        description: Identificador global do registro no sistema de origem.
        data_tests:
          - not_null

      - name: modified_at
        description: Data e hora da última modificação no sistema de origem.
        data_tests:
          - not_null

      - name: _loaded_at
        description: Data e hora em que o registro foi carregado na camada raw.
        data_tests:
          - not_null

      - name: _source_table
        description: Tabela de origem do registro.
        data_tests:
          - not_null