version: 2

models:
  - name: stg_salesorderheader
    description: Pedidos de venda padronizados a partir da camada raw.

    columns:
      - name: sales_order_id
        description: Identificador único do pedido.
        data_tests:
          - not_null
          - unique

      - name: customer_id
        description: Identificador do cliente associado ao pedido.
        data_tests:
          - not_null

      - name: order_date
        description: Data em que o pedido foi realizado.
        data_tests:
          - not_null



  - name: stg_salesorderdetail
    description: Itens dos pedidos de venda padronizados a partir da camada raw.

    columns:
      - name: sales_order_detail_id
        description: Identificador único do item do pedido.
        data_tests:
          - not_null
          - unique

      - name: sales_order_id
        description: Identificador do pedido ao qual o item pertence.
        data_tests:
          - not_null

      - name: product_id
        description: Identificador do produto vendido.
        data_tests:
          - not_null

      - name: order_quantity
        description: Quantidade vendida do produto.
        data_tests:
          - not_null

      - name: unit_price
        description: Preço unitário do produto no pedido.
        data_tests:
          - not_null


  - name: stg_customer
    description: Clientes padronizados a partir da camada raw.

    columns:
      - name: customer_id
        description: Identificador único do cliente.
        data_tests:
          - not_null
          - unique

      - name: territory_id
        description: Identificador do território comercial associado ao cliente.

  - name: stg_person
    description: Pessoas padronizadas a partir da camada raw.

    columns:
      - name: business_entity_id
        description: Identificador único da pessoa.
        data_tests:
          - not_null
          - unique

      - name: person_type
        description: Tipo de pessoa no AdventureWorks.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['EM', 'GC', 'IN', 'SC', 'SP', 'VC']

      - name: first_name
        description: Primeiro nome da pessoa.
        data_tests:
          - not_null

      - name: last_name
        description: Sobrenome da pessoa.
        data_tests:
          - not_null




  - name: stg_salesterritory
    description: Territórios comerciais padronizados a partir da camada raw.

    columns:
      - name: territory_id
        description: Identificador único do território comercial.
        data_tests:
          - not_null
          - unique

      - name: territory_name
        description: Nome do território comercial.
        data_tests:
          - not_null

      - name: country_region_code
        description: Código do país ou região do território.
        data_tests:
          - not_null

      - name: territory_group
        description: Grupo geográfico ao qual pertence o território.
        data_tests:
          - not_null



  - name: stg_product
    description: Produtos padronizados a partir da camada raw.

    columns:
      - name: product_id
        description: Identificador único do produto.
        data_tests:
          - not_null
          - unique

      - name: product_name
        description: Nome do produto.
        data_tests:
          - not_null

      - name: product_number
        description: Código único de identificação do produto.
        data_tests:
          - not_null
          - unique

      - name: is_manufactured
        description: Indica se o produto é fabricado internamente.
        data_tests:
          - not_null

      - name: is_finished_good
        description: Indica se o produto está disponível para venda.
        data_tests:
          - not_null

      - name: standard_cost
        description: Custo padrão do produto.
        data_tests:
          - not_null

      - name: list_price
        description: Preço de tabela do produto.
        data_tests:
          - not_null

      - name: sell_start_date
        description: Data de início da comercialização.
        data_tests:
          - not_null





  - name: stg_store
    description: >
      Padroniza o cadastro de lojas do AdventureWorks. Possui uma linha por
      loja e serve para identificar os clientes empresariais.

    columns:
      - name: business_entity_id
        description: Identificador único da loja e chave de relacionamento com stg_customer.store_id.
        data_tests:
          - not_null
          - unique

      - name: store_name
        description: Nome da loja ou empresa.
        data_tests:
          - not_null

      - name: sales_person_id
        description: Identificador do vendedor responsável pela loja.

      - name: demographics
        description: Informações demográficas da loja armazenadas em XML.

      - name: row_guid
        description: Identificador global do registro no sistema de origem.
        data_tests:
          - not_null

      - name: modified_at
        description: Data e hora da última modificação no sistema de origem.
        data_tests:
          - not_null

      - name: _loaded_at
        description: Data e hora em que o registro foi carregado na camada raw.
        data_tests:
          - not_null

      - name: _source_table
        description: Tabela de origem do registro.
        data_tests:
          - not_null




  - name: stg_specialoffer
    description: >
      Ofertas especiais padronizadas a partir da camada raw. Contém as regras
      comerciais de desconto, período de validade e limites de quantidade.

    columns:
      - name: special_offer_id
        description: Identificador único da oferta especial.
        data_tests:
          - not_null
          - unique

      - name: special_offer_description
        description: Descrição comercial da oferta especial.
        data_tests:
          - not_null

      - name: discount_percentage
        description: >
          Percentual de desconto armazenado em formato decimal. Por exemplo,
          0.10 representa um desconto de 10%.
        data_tests:
          - not_null

      - name: offer_type
        description: Tipo da oferta especial.
        data_tests:
          - not_null

      - name: offer_category
        description: Categoria à qual pertence a oferta especial.
        data_tests:
          - not_null

      - name: start_date
        description: Data e hora de início da validade da oferta.
        data_tests:
          - not_null

      - name: end_date
        description: Data e hora de término da validade da oferta.
        data_tests:
          - not_null

      - name: minimum_quantity
        description: Quantidade mínima necessária para aplicação da oferta.
        data_tests:
          - not_null

      - name: maximum_quantity
        description: >
          Quantidade máxima permitida para aplicação da oferta. Pode ser nula
          quando a oferta não possui limite máximo.

      - name: row_guid
        description: Identificador global do registro no sistema de origem.
        data_tests:
          - not_null

      - name: modified_at
        description: Data e hora da última modificação no sistema de origem.
        data_tests:
          - not_null

      - name: _loaded_at
        description: Data e hora em que o registro foi carregado na camada raw.
        data_tests:
          - not_null

      - name: _source_table
        description: Tabela de origem do registro.
        data_tests:
          - not_null


  - name: stg_salesperson
    description: Informações comerciais dos vendedores padronizadas a partir da camada raw.

    columns:
      - name: business_entity_id
        description: Identificador único do vendedor.
        data_tests:
          - not_null
          - unique

      - name: territory_id
        description: Identificador do território comercial associado ao vendedor. Pode ser nulo quando não há território atribuído.

      - name: sales_quota
        description: Meta de vendas atribuída ao vendedor. Pode ser nula quando não há meta definida.

      - name: bonus
        description: Valor do bônus atribuído ao vendedor.
        data_tests:
          - not_null

      - name: commission_pct
        description: Percentual de comissão aplicado às vendas do vendedor.
        data_tests:
          - not_null

      - name: sales_ytd
        description: Valor acumulado das vendas realizadas pelo vendedor no ano corrente.
        data_tests:
          - not_null

      - name: sales_last_year
        description: Valor acumulado das vendas realizadas pelo vendedor no ano anterior.
        data_tests:
          - not_null

      - name: row_guid
        description: Identificador técnico global proveniente do sistema de origem.
        data_tests:
          - not_null
          - unique

      - name: modified_at
        description: Data e hora da última alteração do registro no sistema de origem.
        data_tests:
          - not_null

      - name: _loaded_at
        description: Data e hora em que o registro foi carregado na camada raw.
        data_tests:
          - not_null

      - name: _source_table
        description: Nome da tabela de origem do registro.
        data_tests:
          - not_null


  - name: stg_employee
    description: >
      Padroniza os dados dos funcionários provenientes da tabela raw.employee.
      O modelo preserva informações pessoais, profissionais, hierárquicas e
      metadados técnicos da ingestão, sem aplicar cálculos derivados.

    columns:
      - name: business_entity_id
        description: Identificador único do funcionário.
        data_tests:
          - not_null
          - unique

      - name: national_id_number
        description: Número de identificação nacional do funcionário.
        data_tests:
          - not_null

      - name: login_id
        description: Identificador de login do funcionário.
        data_tests:
          - not_null
          - unique

      - name: job_title
        description: Cargo ocupado pelo funcionário.
        data_tests:
          - not_null

      - name: birth_date
        description: Data de nascimento do funcionário.
        data_tests:
          - not_null

      - name: marital_status
        description: >
          Estado civil do funcionário. M representa casado e S representa
          solteiro.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['M', 'S']

      - name: gender
        description: >
          Código de gênero do funcionário. F representa feminino e M representa
          masculino.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['F', 'M']

      - name: hire_date
        description: Data de contratação do funcionário.
        data_tests:
          - not_null

      - name: is_salaried
        description: Indica se o funcionário recebe salário fixo.
        data_tests:
          - not_null

      - name: vacation_hours
        description: Saldo de horas de férias do funcionário.
        data_tests:
          - not_null

      - name: sick_leave_hours
        description: Saldo de horas de licença médica do funcionário.
        data_tests:
          - not_null

      - name: is_current
        description: Indica se o registro do funcionário está ativo.
        data_tests:
          - not_null

      - name: row_guid
        description: Identificador global do registro no sistema de origem.
        data_tests:
          - not_null
          - unique

      - name: modified_at
        description: Data e hora da última modificação no sistema de origem.
        data_tests:
          - not_null

      - name: organization_node
        description: Caminho hierárquico do funcionário na organização.
        data_tests:
          - not_null

      - name: _loaded_at
        description: Data e hora em que o registro foi carregado na camada raw.
        data_tests:
          - not_null

      - name: _source_table
        description: Tabela de origem do registro.
        data_tests:
          - not_null