version: 2

data_tests:
  - name: assert_sales_order_subtotals_match
    description: >
      Reconcilia os valores financeiros dos pedidos comparando o subtotal
      registrado no cabeçalho com a soma do valor líquido de seus itens.

      O subtotal calculado corresponde à soma de net_amount por sales_order_id,
      considerando quantidade, preço unitário e desconto.

      O teste retorna pedidos ausentes em um dos lados da comparação ou cuja
      diferença entre o subtotal esperado e o calculado seja superior a 0,01.
      Quando nenhuma linha é retornada, o teste é aprovado.

      Este controle ajuda a identificar cálculos incorretos de desconto, itens
      perdidos ou duplicados e problemas na associação entre cabeçalhos e itens.



  - name: assert_salesperson_amounts_are_non_negative
    description: >
      Verifica se os valores comerciais associados aos vendedores são
      maiores ou iguais a zero.

      O teste valida a meta de vendas, o bônus, as vendas acumuladas no ano
      corrente e as vendas realizadas no ano anterior.

      Registros com sales_quota nulo são permitidos, pois alguns vendedores
      podem não possuir uma meta definida. O teste falha quando encontra
      qualquer valor negativo nos campos avaliados.

      

  - name: assert_salesperson_commission_is_valid
    description: >
      Verifica se o percentual de comissão dos vendedores está dentro do
      intervalo válido entre 0 e 1.

      O valor é armazenado como proporção, portanto 0,02 representa uma
      comissão de 2%. O teste falha quando encontra uma comissão negativa
      ou superior a 100%.


  - name: assert_employee_dates_are_valid
    description: >
      Valida a consistência cronológica das datas dos funcionários. O teste
      falha quando encontra nascimento ou contratação no futuro, ou quando a
      contratação ocorre antes ou na mesma data do nascimento. Não valida idade
      mínima para contratação, pois essa regra de negócio não foi confirmada.

  - name: assert_employee_hours_are_non_negative
    description: >
      Valida que os saldos de horas de férias e de licença médica dos
      funcionários não sejam negativos.


  - name: assert_fact_sales_quantity_is_positive
    description: >
      Verifica se a quantidade vendida em cada item do pedido é maior que zero.

      O teste falha quando encontra uma quantidade igual ou inferior a zero.

  - name: assert_fact_sales_unit_price_is_positive
    description: >
      Verifica se o preço unitário de cada item vendido é maior que zero.

      O teste falha quando encontra um preço unitário igual ou inferior a zero.

  - name: assert_fact_sales_net_amount_is_valid
    description: >
      Verifica se o valor líquido do item corresponde ao valor bruto menos o
      valor do desconto.

      É aceita uma diferença máxima de 0,0001 devido ao arredondamento
      individual das medidas. O teste falha quando encontra uma divergência
      superior a essa tolerância.

  - name: assert_fact_sales_monthly_metrics_are_valid
    description: >
      Garante que contagens, quantidades e valores monetários da série mensal
      consolidada não sejam negativos.

  - name: assert_fact_sales_monthly_reconciles
    description: >
      Reconcilia fact_sales_monthly com fact_sales. A receita líquida aceita
      tolerância monetária de 0,01; pedidos distintos e unidades vendidas devem
      coincidir exatamente.
