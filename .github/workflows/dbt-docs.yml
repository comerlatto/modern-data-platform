name: Publish dbt Docs

on:
  push:
    branches: [main]
    paths:
      - "dbt/adventure_works/**"
      - "airflow/dbt/profiles.yml"
      - ".github/workflows/dbt-docs.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: dbt-docs-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: airflow/requirements.txt

      - name: Install dbt
        run: pip install dbt-core==1.12.0 dbt-postgres==1.11.0

      - name: Parse dbt project
        run: >-
          dbt parse
          --project-dir dbt/adventure_works
          --profiles-dir airflow/dbt

      - name: Generate static dbt Docs
        run: >-
          dbt docs generate
          --project-dir dbt/adventure_works
          --profiles-dir airflow/dbt
          --no-compile
          --empty-catalog
          --static

      - name: Prepare site
        run: |
          mkdir -p _site
          cp dbt/adventure_works/target/static_index.html _site/index.html
          touch _site/.nojekyll

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
