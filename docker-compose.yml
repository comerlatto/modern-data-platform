x-airflow-common: &airflow-common
  build:
    context: ./airflow
  environment: &airflow-common-env
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@airflow_metadata:5432/airflow
    AIRFLOW__CORE__FERNET_KEY: ""
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "true"
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__CORE__EXECUTION_API_SERVER_URL: http://airflow-api-server:8080/execution/
    AIRFLOW__API_AUTH__JWT_SECRET: adventureworks_local_development_secret
    AIRFLOW__CORE__AUTH_MANAGER: airflow.providers.fab.auth_manager.fab_auth_manager.FabAuthManager

    SOURCE_DB_HOST: source
    SOURCE_DB_NAME: ${SOURCE_DB_NAME:-adventureworks}
    SOURCE_DB_USER: ${SOURCE_DB_USER:-adventureworks_user}
    SOURCE_DB_PASSWORD: ${SOURCE_DB_PASSWORD:-adventureworks_dev}
    SOURCE_DB_PORT: 5432

    WAREHOUSE_DB_HOST: warehouse
    WAREHOUSE_DB_NAME: ${WAREHOUSE_DB_NAME:-analytics}
    WAREHOUSE_DB_USER: ${WAREHOUSE_DB_USER:-analytics_user}
    WAREHOUSE_DB_PASSWORD: ${WAREHOUSE_DB_PASSWORD:-analytics_dev}
    WAREHOUSE_DB_PORT: 5432

    MINIO_ENDPOINT: minio:9000
    MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-minioadmin}
    MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin123}
    MINIO_BUCKET: ${MINIO_BUCKET:-adventureworks-raw}
    MINIO_SECURE: "false"

  volumes:
    - ./airflow/dags:/opt/airflow/dags
    - ./airflow/logs:/opt/airflow/logs
    - ./airflow/config:/opt/airflow/config
    - ./airflow/plugins:/opt/airflow/plugins
    - ./airflow/dbt:/opt/airflow/dbt:ro
    - ./:/opt/airflow/project:ro

  user: "${AIRFLOW_UID:-50000}:0"
  restart: unless-stopped


services:
  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    container_name: adventureworks_minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin123}
    ports:
      - "${MINIO_API_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio_data:/data
    restart: unless-stopped

  source:
    image: postgres:16-alpine
    container_name: adventureworks_source
    environment:
      POSTGRES_DB: ${SOURCE_DB_NAME:-adventureworks}
      POSTGRES_USER: ${SOURCE_DB_USER:-adventureworks_user}
      POSTGRES_PASSWORD: ${SOURCE_DB_PASSWORD:-adventureworks_dev}
    ports:
      - "${SOURCE_DB_PORT:-5433}:5432"
    volumes:
      - source_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${SOURCE_DB_USER:-adventureworks_user} -d ${SOURCE_DB_NAME:-adventureworks}",
        ]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  warehouse:
    image: postgres:16-alpine
    container_name: adventureworks_warehouse
    environment:
      POSTGRES_DB: ${WAREHOUSE_DB_NAME:-analytics}
      POSTGRES_USER: ${WAREHOUSE_DB_USER:-analytics_user}
      POSTGRES_PASSWORD: ${WAREHOUSE_DB_PASSWORD:-analytics_dev}
    ports:
      - "${WAREHOUSE_DB_PORT:-5434}:5432"
    volumes:
      - warehouse_data:/var/lib/postgresql/data
      - ./database/init/warehouse:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${WAREHOUSE_DB_USER:-analytics_user} -d ${WAREHOUSE_DB_NAME:-analytics}",
        ]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  airflow_metadata:
    image: postgres:16-alpine
    container_name: adventureworks_airflow_metadata
    environment:
      POSTGRES_DB: airflow
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
    volumes:
      - airflow_metadata_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U airflow -d airflow",
        ]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  airflow-init:
    <<: *airflow-common
    container_name: adventureworks_airflow_init
    restart: "no"
    depends_on:
      airflow_metadata:
        condition: service_healthy
      source:
        condition: service_healthy
      warehouse:
        condition: service_healthy
      minio:
        condition: service_started
    command:
      - bash
      - -c
      - |
        airflow db migrate &&
        airflow users create \
          --username airflow \
          --password airflow \
          --firstname Airflow \
          --lastname Admin \
          --role Admin \
          --email airflow@example.com || true

  airflow-api-server:
    <<: *airflow-common
    container_name: adventureworks_airflow_api_server
    command: api-server
    ports:
      - "8080:8080"
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          "CMD",
          "curl",
          "--fail",
          "http://localhost:8080/api/v2/monitor/health",
        ]
      interval: 15s
      timeout: 10s
      retries: 10

  airflow-scheduler:
    <<: *airflow-common
    container_name: adventureworks_airflow_scheduler
    command: scheduler
    depends_on:
      airflow-init:
        condition: service_completed_successfully
      airflow-api-server:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "airflow jobs check --job-type SchedulerJob --local",
        ]
      interval: 15s
      timeout: 10s
      retries: 10

  airflow-dag-processor:
    <<: *airflow-common
    container_name: adventureworks_airflow_dag_processor
    command: dag-processor
    depends_on:
      airflow-init:
        condition: service_completed_successfully
      airflow-api-server:
        condition: service_healthy

  observability-api:
    build:
      context: ./observability/api
    container_name: adventureworks_observability_api
    environment:
      WAREHOUSE_DB_HOST: warehouse
      WAREHOUSE_DB_NAME: ${WAREHOUSE_DB_NAME:-analytics}
      WAREHOUSE_DB_USER: ${WAREHOUSE_DB_USER:-analytics_user}
      WAREHOUSE_DB_PASSWORD: ${WAREHOUSE_DB_PASSWORD:-analytics_dev}
      WAREHOUSE_DB_PORT: 5432
      OBSERVABILITY_UI_ORIGIN: http://localhost:3000
    ports:
      - "8000:8000"
    depends_on:
      warehouse:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')",
        ]
      interval: 15s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  observability-ui:
    build:
      context: ./observability/ui
      args:
        VITE_API_URL: http://localhost:8000
    container_name: adventureworks_observability_ui
    ports:
      - "3000:3000"
    depends_on:
      observability-api:
        condition: service_healthy
    restart: unless-stopped


volumes:
  source_data:
  warehouse_data:
  airflow_metadata_data:
  minio_data:
